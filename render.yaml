services:
  - type: web
    name: bumblearn
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bumblearn-db
          property: connectionString

databases:
  - name: bumblearn-db
    plan: free
    databaseName: bumblearn
    user: bumblearn
