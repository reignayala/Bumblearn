name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "404.html"
      - "assets/**"
      - ".nojekyll"
      - "favicon.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client for GitHub Pages
        run: npm run build --workspace=client
        env:
          VITE_BASE_PATH: /Bumblearn/
          # Set BUMBLEARN_API_URL in repo variables to override. Default: Render API.
          VITE_API_URL: ${{ vars.BUMBLEARN_API_URL || 'https://bumblearn-api.onrender.com' }}

      - name: Publish build to repo root for Pages
        run: |
          rm -rf assets
          cp client/dist/index.html index.html
          cp client/dist/index.html 404.html
          cp -r client/dist/assets assets
          cp client/dist/favicon.svg favicon.svg
          cp client/public/.nojekyll .nojekyll

      - name: Commit and push static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets .nojekyll favicon.svg
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Deploy GitHub Pages [skip ci]"
          git push
